name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built on glibc 2.28 (AlmaLinux 8 manylinux) so older distributions can run them.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            container: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-${{ matrix.target }}
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0-${{ matrix.target }}
          components: rustfmt, clippy
      - name: Select compatible native ARM64 C++ toolset
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64 -property installationPath
          if (-not $vs) { throw 'Native ARM64 MSVC 14.44 toolset is required for bundled DuckDB 1.4.1' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $lines = & cmd.exe /d /s /c "`"$devcmd`" -no_logo -arch=arm64 -host_arch=arm64 -vcvars_ver=14.44 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize MSVC 14.44 ARM64 environment' }
          $names = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')
          foreach ($line in $lines) {
            $pair = $line -split '=', 2
            if ($pair.Length -eq 2 -and $pair[0] -in $names) { $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          $version = ($lines | Where-Object { $_ -like 'VCToolsVersion=*' }) -replace '^VCToolsVersion=', ''
          if ($version -notlike '14.44.*') { throw "Unexpected C++ toolset: $version" }
          Write-Output "Native ARM64 C++ toolset: $version"
      - name: Linux build dependencies on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          # Perl modules for the statically linked OpenSSL; the image's Python 3.13 runs the release tools.
          dnf install -y perl-IPC-Cmd perl-Time-Piece
          echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"
          ldd --version | head -n 1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: yyte-db-${{ runner.os }}-${{ runner.arch }}${{ matrix.os == 'windows-11-arm' && '-v143' || '' }}${{ runner.os == 'Linux' && '-glibc228' || '' }}
      - run: python -B tools/test_release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- --help
      - run: cargo run --locked --bin markdownViewer -- --plain demo/markdown-preview.md
      - run: python tools/release.py verify --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: yyte-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/yyte
            target/release/yyte.exe
            target/release/markdownViewer
            target/release/markdownViewer.exe
            README.md
            COPYING
            docs/user/**
            docs/developer/**
            demo/**
