name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-${{ matrix.target }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: yyte-${{ runner.os }}-${{ runner.arch }}
      - run: python -B tools/test_release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- --help
      - run: cargo run --locked --bin markdownViewer -- --plain demo/markdown-preview.md
      - run: python tools/release.py verify --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: yyte-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/yyte
            target/release/yyte.exe
            target/release/markdownViewer
            target/release/markdownViewer.exe
            README.md
            COPYING
            docs/user/**
            docs/developer/**
            demo/**
